<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيل مشروع Sheeta video Editor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #f0f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
        }
        .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            color: #ffffff;
        }
        p {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }
        .download-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
        }
        .meta {
            margin-top: 24px;
            font-size: 13px;
            color: #6e7681;
            border-top: 1px solid #30363d;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎬</div>
        <h1>Sheeta video Editor</h1>
        <p>مشروع تطبيق Android كامل ومبني بواسطة Kotlin و Jetpack Compose لدمج الصور ومقاطع الصوت في فيديو MP4 خفيف وسريع يعمل Offline بالكامل.</p>
        <a class="download-btn" href="/SheetaVideoEditor.zip" download="SheetaVideoEditor.zip">
            <span>⬇️ تنزيل ملف المشروع (ZIP)</span>
        </a>
        <div class="meta">
            الحجم: ~23 MB • يتضمن الكود المصدري كاملاً وملفات Gradle و APK جاهز
        </div>
    </div>
</body>
</html>
